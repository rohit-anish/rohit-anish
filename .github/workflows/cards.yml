name: Refresh README cards
on:
  schedule:
    - cron: "30 1 * * *"   # daily, 07:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Accept GitHub's counts even if lower than saved ones"
        type: boolean
        default: false
  push:
    paths: ["config.json", "scripts/**", "fonts/**"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch contribution + repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/fetch_data.py
      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python scripts/render_readme_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
